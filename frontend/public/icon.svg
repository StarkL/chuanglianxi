<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#A29BFE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6C5CE7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" filter="url(#shadow)"/>
  <!-- Decorative connection nodes & lines -->
  <circle cx="256" cy="180" r="48" fill="#FFFFFF"/>
  <circle cx="160" cy="330" r="38" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="352" cy="330" r="38" fill="#FFFFFF" fill-opacity="0.9"/>
  <!-- Connecting links -->
  <line x1="256" y1="180" x2="160" y2="330" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="256" y1="180" x2="352" y2="330" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="160" y1="330" x2="352" y2="330" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-dasharray="16 12" stroke-opacity="0.6"/>
  <!-- Inner pulse rings -->
  <circle cx="256" cy="180" r="24" fill="#6C5CE7"/>
  <circle cx="160" cy="330" r="18" fill="#6C5CE7"/>
  <circle cx="352" cy="330" r="18" fill="#6C5CE7"/>
</svg>
